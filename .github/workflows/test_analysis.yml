name: Week 3 Tests (SQL & Testing)
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-week3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r test/requirements-test.txt
      - name: Run Week 3 tests
        run: |
          pytest test/test_Analysis_Notebook.py -v --tb=short
      - name: Test Summary
        if: always()
        run: |
          echo "✅ Analysis tests completed"
